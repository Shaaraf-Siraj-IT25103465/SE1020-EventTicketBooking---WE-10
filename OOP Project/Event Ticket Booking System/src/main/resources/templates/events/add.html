<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Event</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 85vh;">
    <div class="card" style="width: 100%; max-width: 550px; background: white;">
        <h1>Create New Event</h1>
        <form th:action="@{/events/add}" method="post">
            <div class="form-group">
                <label>Event Id</label>
                <label>
                    <input type="text" name="eventId" required>
                </label>
            </div>
            <div class="form-group">
                <label>Event Name</label>
                <label>
                    <input type="text" name="eventName" required>
                </label>
            </div>
            <div class="form-group">
                <label>Date</label>
                <label>
                    <input type="date" name="date" required>
                </label>
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="time" name="time" required>
            </div>
            <div class="form-group">
                <label>Venue</label>
                <label>
                    <input type="text" name="venue" required>
                </label>
            </div>
            <div class="form-group">
                <label>Total Seats</label>
                <label>
                    <input type="number" name="totalSeats" required>
                </label>
            </div>
            <div class="form-group">
                <label>Available Seats</label>
                <label>
                    <input type="number" name="availableSeats" required>
                </label>
            </div>
            <div class="form-group">
                <label>Ticket Price</label>
                <label>
                    <input type="number" name="ticketPrice" required>
                </label>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
                <a th:href="@{/events/list}" class="btn btn-outline" style="text-decoration: none;">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Event</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
