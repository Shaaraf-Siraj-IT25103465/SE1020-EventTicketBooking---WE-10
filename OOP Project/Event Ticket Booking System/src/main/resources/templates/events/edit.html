<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Event</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 85vh;">

    <div class="card" style="width: 100%; max-width: 550px; background: white;">
        <h1 style="margin-bottom: 1.5rem; text-align: center;">Modify Event Details</h1>

        <form th:action="@{/events/update}" method="post" th:object="${event}">

            <input type="hidden" name="eventId" th:value="${event.eventId}">

            <div class="form-group">
                <label>Event Name</label>
                <label>
                    <input type="text" th:field="*{eventName}" required>
                </label>
            </div>

            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Category</label>
                    <select th:field="*{category}">
                        <option value="Concert">Concert</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Workshop">Workshop</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Venue</label>
                    <input type="text" th:field="*{venue}" required>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Event Date</label>
                    <label>
                        <input type="date" th:field="*{date}" required>
                    </label>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Event Time</label>
                    <label>
                        <input type="time" th:field="*{time}" required>
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Ticket Price ($)</label>
                    <label>
                        <input type="number" step="0.01" th:field="*{ticketPrice}" required>
                    </label>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Total Capacity</label>
                    <label>
                        <input type="number" th:field="*{totalSeats}" required>
                    </label>
                </div>
                <input type="hidden" name="availableSeats" th:value="${event.availableSeats}">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                <a th:href="@{/events/list}" class="btn btn-outline" style="text-decoration: none;">Cancel Changes</a>
                <button type="submit" class="btn btn-primary">Update Configuration</button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
